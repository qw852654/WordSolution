<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>讲义编排器</title>
  <link rel="stylesheet" href="./shared-tree.css?v=20260526-tree-main-2">
  <link rel="stylesheet" href="./handouts.css?v=20260526-tree-main-2">
  <link rel="stylesheet" href="./question-bank-context.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M4 4h16v16H4z"></path>
            <path d="M8 8h8M8 12h8M8 16h5"></path>
          </svg>
        </div>
        <div>
          <h1>讲义编排器</h1>
          <p data-current-question-bank-label>当前题库：加载中</p>
        </div>
      </div>
      <div data-question-bank-switcher></div>

      <nav class="nav-stack" aria-label="模块导航">
        <a class="nav-link" href="./cms.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4.8A2.8 2.8 0 0 1 7.8 2H19v17.2A2.8 2.8 0 0 1 16.2 22H5V4.8Z"></path>
            <path d="M8 6.5h7.5M8 10h7.5M8 13.5h4.5"></path>
          </svg>
          内容库
        </a>
        <a class="nav-link" href="./sections.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16.5A2.5 2.5 0 0 1 17.5 22H4V5.5Z"></path>
            <path d="M8 7h8M8 11h8M8 15h5"></path>
          </svg>
          小节编辑器
        </a>
        <a class="nav-link" href="./references.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 7h8M8 12h8M8 17h5"></path>
            <path d="M4 5a2 2 0 0 1 2-2h10l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path>
            <path d="M16 3v5h5"></path>
          </svg>
          引用审查
        </a>
      </nav>

      <section class="panel">
        <div class="panel-title-row">
          <h2>筛选</h2>
          <button class="icon-button" id="refreshButton" type="button" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
              <path d="M21 3v6h-6"></path>
            </svg>
          </button>
        </div>

        <label class="field">
          <span>关键词</span>
          <input id="keywordInput" type="search" autocomplete="off" placeholder="标题 / 摘要">
        </label>

        <label class="field">
          <span>状态</span>
          <select id="statusSelect">
            <option value="">全部状态</option>
            <option value="草稿">草稿</option>
            <option value="可生成">可生成</option>
            <option value="已归档">已归档</option>
          </select>
        </label>

        <button class="primary-button full-button" id="searchButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m21 21-4.34-4.34"></path>
            <circle cx="11" cy="11" r="7"></circle>
          </svg>
          查询
        </button>
      </section>

      <section class="panel">
        <h2>新建讲义</h2>
        <label class="field">
          <span>标题</span>
          <input id="newTitleInput" type="text" autocomplete="off" placeholder="例如：动量专题讲义">
        </label>
        <button class="primary-button full-button" id="createHandoutButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          新建
        </button>
      </section>
    </aside>

    <main class="workspace">
      <section class="list-column">
        <div class="section-header">
          <div>
            <h2>讲义</h2>
            <p id="handoutCountText">0 条</p>
          </div>
          <div class="status-chip" id="globalStatus">就绪</div>
        </div>
        <div class="handout-list" id="handoutList" role="list"></div>
      </section>

      <section class="detail-column">
        <div class="detail-header">
          <div>
            <p class="eyebrow" id="detailEyebrow">未选择</p>
            <h2 id="detailTitle">选择一个讲义</h2>
          </div>
          <div class="toolbar">
            <button class="secondary-button" id="openPickerButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              添加到讲义
            </button>
            <button class="primary-button" id="generateButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 3h8l4 4v14H6z"></path>
                <path d="M14 3v5h5M9 15h6M9 18h6"></path>
              </svg>
              生成 Word
            </button>
          </div>
        </div>

        <div class="detail-grid">
          <section class="panel">
            <div class="panel-title-row">
              <h2>讲义信息</h2>
              <button class="secondary-button" id="saveHandoutButton" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
                  <path d="M17 21v-8H7v8M7 3v5h8"></path>
                </svg>
                保存
              </button>
            </div>
            <div class="form-grid">
              <label class="field">
                <span>标题</span>
                <input id="editTitleInput" type="text" disabled>
              </label>
              <label class="field">
                <span>状态</span>
                <select id="editStatusSelect" disabled>
                  <option value="草稿">草稿</option>
                  <option value="可生成">可生成</option>
                  <option value="已归档">已归档</option>
                </select>
              </label>
            </div>
            <label class="field">
              <span>摘要</span>
              <textarea id="editSummaryInput" disabled></textarea>
            </label>
            <p class="message-line" id="metadataMessageText">选择讲义后可以编辑元数据。</p>
          </section>

          <section class="panel">
            <div class="panel-title-row">
              <h2>生成记录</h2>
              <span class="muted-text" id="generationCountText">0 条</span>
            </div>
            <div class="generation-list" id="generationList"></div>
          </section>
        </div>

        <div class="arrangement-grid">
          <section class="panel tree-panel">
            <div class="panel-title-row">
              <div>
                <h2>编排树</h2>
                <p class="panel-hint" id="arrangementTreeMessageText">选择讲义后显示完整编排层级。</p>
              </div>
              <button class="secondary-button" id="refreshTreeButton" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                  <path d="M21 3v6h-6"></path>
                </svg>
                刷新
              </button>
            </div>
            <div class="arrangement-tree-wrap" id="arrangementTree"></div>
          </section>

          <section class="panel context-panel">
            <div class="panel-title-row">
              <div>
                <h2>节点详情</h2>
                <p class="panel-hint" id="contextMessageText">选择树节点后显示可执行操作。</p>
              </div>
            </div>
            <div class="context-summary" id="contextSummary"></div>
            <div class="context-actions">
              <button class="primary-button" id="editContextBlockButton" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                </svg>
                在 Word 中编辑
              </button>
              <button class="secondary-button" id="reloadContextPreviewButton" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                  <path d="M21 3v6h-6"></path>
                </svg>
                刷新预览
              </button>
            </div>
            <div class="context-session">
              <div>
                <span>状态</span>
                <strong id="contextSessionStatusText">无会话</strong>
              </div>
              <div>
                <span>版本</span>
                <strong id="contextSessionVersionText">-</strong>
              </div>
              <div>
                <span>会话</span>
                <strong id="contextSessionIdText">-</strong>
              </div>
            </div>
            <div class="preview-frame-wrap">
              <iframe id="contextPreviewFrame" title="选中内容块 HTML 预览"></iframe>
              <div class="empty-preview" id="contextEmptyPreview">选择内容块后显示预览</div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="pickerBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="modal-header">
        <div>
          <p class="eyebrow">添加到讲义</p>
          <h2 id="pickerTitle">选择项目</h2>
        </div>
        <button class="icon-button" id="closePickerButton" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="picker-controls">
        <label class="field">
          <span>类型</span>
          <select id="pickerTargetTypeSelect">
            <option value="小节">小节</option>
            <option value="内容块">内容块</option>
          </select>
        </label>
        <label class="field">
          <span>关键词</span>
          <input id="pickerSearchInput" type="search" autocomplete="off" placeholder="搜索标题 / 摘要">
        </label>
        <label class="field" id="pickerRoleField">
          <span>角色</span>
          <input id="pickerRoleInput" type="text" autocomplete="off" placeholder="例如：知识点 / 例题 / 练习">
        </label>
        <label class="field" id="referenceModeField">
          <span>版本</span>
          <select id="referenceModeSelect">
            <option value="跟随最新">跟随最新</option>
            <option value="锁定版本">锁定当前版本</option>
          </select>
        </label>
      </div>

      <div class="candidate-list" id="candidateList"></div>
    </div>
  </div>

  <script src="./shared-tree.js?v=20260526-tree-main-2"></script>
  <script src="./question-bank-context.js"></script>
  <script src="./handouts.js?v=20260526-tree-main-2"></script>
</body>
</html>
