<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小节编排静态原型</title>
  <link rel="stylesheet" href="./content-block-card.css">
  <link rel="stylesheet" href="./sections.css">
</head>
<body>
  <div class="prototype-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">小节编排页面 · 静态原型</p>
        <h1>机械能守恒</h1>
      </div>
      <div class="topbar-actions">
        <span class="status-chip">假数据</span>
        <span class="status-chip muted">不接 API</span>
      </div>
    </header>

    <main class="section-composer" id="sectionComposer">
      <aside class="section-tree-panel teaching-topic-nav" id="teachingTopicNav" aria-labelledby="sectionTreeTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">左侧</p>
            <h2 id="sectionTreeTitle">教学主题导航</h2>
          </div>
          <button class="icon-button nav-collapse-button" type="button" id="toggleTopicNavButton" aria-label="收起教学主题导航" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
        </div>
        <nav class="section-tree teaching-tree" id="sectionTree" aria-label="教学主题导航"></nav>
      </aside>

      <section class="composition-panel" aria-labelledby="workspaceTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">中间</p>
            <h2 id="workspaceTitle">当前小节的层级卡片工作区</h2>
          </div>
          <button class="secondary-button" type="button" data-placeholder="添加下级内容">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            添加下级内容
          </button>
        </div>
        <div class="section-summary" id="sectionSummary"></div>
        <div class="card-workspace" id="cardWorkspace"></div>
      </section>

      <aside class="detail-panel" aria-labelledby="detailTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">右侧</p>
            <h2 id="detailTitle">选中卡片详情</h2>
          </div>
        </div>

        <section class="detail-card" id="selectedDetail"></section>

        <section class="detail-card">
          <div class="detail-card-heading">
            <h3>内容预览</h3>
            <span class="status-chip muted">HTML 占位</span>
          </div>
          <div class="preview-surface" id="previewSurface"></div>
        </section>

        <section class="detail-card">
          <div class="detail-card-heading">
            <h3>操作入口</h3>
            <span class="status-chip muted">占位</span>
          </div>
          <div class="detail-actions">
            <button class="primary-button" type="button" data-placeholder="Word 编辑">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
              Word 编辑
            </button>
            <button class="secondary-button" type="button" data-placeholder="从资源库插入">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3"></path><circle cx="11" cy="11" r="7"></circle></svg>
              从资源库插入
            </button>
            <button class="ghost-button" type="button" data-placeholder="添加下级内容">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              添加下级内容
            </button>
          </div>
          <p class="action-message" id="actionMessage">本轮所有按钮只展示入口，不调用 Word，不写入后端。</p>
        </section>
      </aside>
    </main>
  </div>

  <div class="resource-drawer is-hidden" id="resourceDrawer" role="dialog" aria-modal="true" aria-labelledby="resourceDrawerTitle">
    <section class="resource-dialog">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">添加卡片</p>
          <h2 id="resourceDrawerTitle">搜索内容资源</h2>
        </div>
        <button class="icon-button" type="button" id="closeResourceDrawerButton" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>
      <label class="search-field">
        <span>关键词</span>
        <input id="resourceSearchInput" type="search" autocomplete="off" placeholder="搜索知识点、例题、练习或组合块">
      </label>
      <div class="resource-results" id="resourceResults"></div>
      <div class="resource-placeholder">
        <strong>静态占位</strong>
        <p>本轮只展示卡片搜索框与候选样式，不执行真实搜索，不写入小节。</p>
      </div>
    </section>
  </div>

  <script src="./sections.js"></script>
</body>
</html>
