<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教学主题与小节编排静态原型</title>
  <link rel="stylesheet" href="./shared-tree.css">
  <link rel="stylesheet" href="./content-block-card.css">
  <link rel="stylesheet" href="./sections.css">
</head>
<body>
  <div class="prototype-shell">
    <header class="topbar">
      <div class="topbar-main">
        <p class="eyebrow" id="pageEyebrow">教学主题工作台 · 静态原型</p>
        <h1 id="pageTitle">机械能守恒</h1>
        <div class="breadcrumb" id="breadcrumb">功能关系 / 机械能守恒</div>
      </div>
      <div class="topbar-actions">
        <button class="secondary-button" type="button" id="backToTopicButton" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          返回主题工作台
        </button>
        <span class="status-chip">假数据</span>
        <span class="status-chip muted" id="modeStatus">不接 API</span>
      </div>
    </header>

    <main class="ia-layout" id="iaLayout">
      <aside class="topic-nav-panel teaching-topic-nav" id="topicNavPanel" aria-labelledby="topicNavTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">全局定位</p>
            <h2 id="topicNavTitle">教学主题导航</h2>
          </div>
          <button class="icon-button" type="button" id="topicNavToggleButton" title="展开或收起教学主题导航" aria-label="展开或收起教学主题导航" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
        </div>
        <nav class="topic-tree-wrap" id="topicTree" aria-label="教学主题导航"></nav>
      </aside>

      <aside class="object-outline-panel" id="objectOutlinePanel" hidden aria-labelledby="objectOutlineTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow" id="objectOutlineEyebrow">当前对象</p>
            <h2 id="objectOutlineTitle">结构树</h2>
          </div>
        </div>
        <div class="object-outline-tree" id="objectOutlineTree"></div>
      </aside>

      <section class="main-stage" id="mainStage" aria-live="polite"></section>

      <aside class="detail-panel" id="detailPanel" hidden aria-labelledby="detailTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">右侧</p>
            <h2 id="detailTitle">选中块详情</h2>
          </div>
        </div>
        <section class="detail-card" id="selectedDetail"></section>
        <section class="detail-card" id="detailPreviewCard"></section>
        <section class="detail-card">
          <div class="detail-card-heading">
            <h3>操作入口</h3>
            <span class="status-chip muted">占位</span>
          </div>
          <div class="detail-actions">
            <button class="primary-button" type="button" data-placeholder="Word 编辑">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
              Word 编辑
            </button>
            <button class="secondary-button" type="button" data-placeholder="从资源库插入">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3"></path><circle cx="11" cy="11" r="7"></circle></svg>
              从资源库插入
            </button>
            <button class="ghost-button" type="button" data-placeholder="添加下级内容">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              添加下级内容
            </button>
          </div>
          <p class="action-message" id="actionMessage">本轮所有按钮只展示入口，不调用 Word，不写入后端。</p>
        </section>
      </aside>
    </main>
  </div>

  <div class="resource-drawer is-hidden" id="resourceDrawer" role="dialog" aria-modal="true" aria-labelledby="resourceDrawerTitle">
    <section class="resource-dialog">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">资源插入 · 静态占位</p>
          <h2 id="resourceDrawerTitle">搜索内容资源</h2>
        </div>
        <button class="icon-button" type="button" id="closeResourceDrawerButton" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>
      <label class="search-field">
        <span>关键词</span>
        <input id="resourceSearchInput" type="search" autocomplete="off" placeholder="搜索知识点、例题、练习或组合块">
      </label>
      <div class="resource-results" id="resourceResults"></div>
      <div class="resource-placeholder">
        <strong>本地假交互</strong>
        <p>点击候选只更新页面提示，不创建内容块，不写入小节或讲义。</p>
      </div>
    </section>
  </div>

  <script src="./shared-tree.js"></script>
  <script src="./sections.js"></script>
</body>
</html>
