<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小节编排</title>
  <link rel="stylesheet" href="./shared-tree.css">
  <link rel="stylesheet" href="./content-block-card.css">
  <link rel="stylesheet" href="./question-bank-context.css">
  <link rel="stylesheet" href="./sections.css">
</head>
<body>
  <div class="section-workspace-shell">
    <header class="editor-topbar">
      <div class="topbar-title">
        <p class="eyebrow" id="pageEyebrow">小节编辑器 · 真实 API</p>
        <h1 id="pageTitle">小节编排</h1>
        <p class="breadcrumb" id="pageBreadcrumb">请选择一个小节</p>
      </div>

      <div class="topbar-controls">
        <label class="section-picker">
          <span>当前小节</span>
          <select id="sectionSelect" aria-label="选择当前小节"></select>
        </label>
        <button class="secondary-button" type="button" id="refreshButton">刷新</button>
        <button class="secondary-button" type="button" id="newSectionButton">新建小节</button>
        <button class="primary-button" type="button" id="exportSectionButton">导出当前小节 Word</button>
        <div data-question-bank-switcher></div>
      </div>
    </header>

    <main class="editor-workspace" id="workspaceShell">
      <button class="topic-drawer-tab" type="button" id="topicDrawerTab" aria-controls="topicDrawer" aria-expanded="false">
        <span>教学主题</span>
      </button>

      <aside class="outline-pane" aria-labelledby="outlineTitle">
        <div class="pane-heading">
          <div>
            <p class="eyebrow">Object Outline Tree</p>
            <h2 id="outlineTitle">小节结构树</h2>
          </div>
          <span class="mini-chip" id="outlineCount">0 项</span>
        </div>
        <div class="outline-scroll" id="objectOutlineTree"></div>
      </aside>

      <section class="document-pane" aria-labelledby="documentTitle">
        <div class="document-toolbar">
          <div>
            <p class="eyebrow">Document Flow</p>
            <h2 id="documentTitle">小节展开内容</h2>
          </div>
          <div class="document-toolbar-actions">
            <button class="secondary-button" type="button" id="insertAtEndButton">插入内容</button>
            <button class="ghost-button" type="button" id="newAtEndButton">新增卡片</button>
          </div>
        </div>
        <div class="document-scroll" id="documentFlow"></div>
      </section>

      <aside class="inspector-pane" aria-labelledby="inspectorTitle">
        <div class="pane-heading">
          <div>
            <p class="eyebrow">Inspector Panel</p>
            <h2 id="inspectorTitle">选中块详情</h2>
          </div>
          <span class="mini-chip" id="inspectorKind">未选择</span>
        </div>
        <div class="inspector-scroll" id="inspectorPanel"></div>
      </aside>
    </main>

    <footer class="status-bar" id="statusBar">正在初始化...</footer>
  </div>

  <div class="topic-drawer-backdrop is-hidden" id="topicDrawerBackdrop" aria-hidden="true"></div>
  <aside class="topic-drawer is-hidden" id="topicDrawer" aria-labelledby="topicDrawerTitle" aria-modal="true" role="dialog">
    <div class="drawer-heading">
      <div>
        <p class="eyebrow">Teaching Topic Nav</p>
        <h2 id="topicDrawerTitle">教学主题导航</h2>
      </div>
      <button class="icon-button" type="button" id="closeTopicDrawerButton" aria-label="关闭教学主题导航">×</button>
    </div>
    <nav class="topic-tree" id="topicTree" aria-label="教学主题树"></nav>
    <p class="drawer-note">当前教学主题树仍是临时导航适配层，只负责定位 UI；真实小节数据来自当前题库 API。</p>
  </aside>

  <div class="modal-layer is-hidden" id="resourceModal" role="dialog" aria-modal="true" aria-labelledby="resourceModalTitle">
    <section class="modal-card resource-modal-card">
      <div class="modal-heading">
        <div>
          <p class="eyebrow">插入已有内容块</p>
          <h2 id="resourceModalTitle">从资源库插入</h2>
        </div>
        <button class="icon-button" type="button" id="closeResourceModalButton" aria-label="关闭">×</button>
      </div>
      <div class="resource-toolbar">
        <label>
          <span>关键词</span>
          <input id="resourceSearchInput" type="search" autocomplete="off" placeholder="搜索标题、备注、摘要">
        </label>
        <label>
          <span>引用模式</span>
          <select id="referenceModeSelect">
            <option value="跟随最新">跟随最新</option>
            <option value="锁定版本">锁定当前版本</option>
          </select>
        </label>
      </div>
      <div class="resource-results" id="resourceResults"></div>
    </section>
  </div>

  <div class="modal-layer is-hidden" id="createModal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <form class="modal-card create-modal-card" id="createBlockForm">
      <div class="modal-heading">
        <div>
          <p class="eyebrow">新增并插入</p>
          <h2 id="createModalTitle">新建内容块卡片</h2>
        </div>
        <button class="icon-button" type="button" id="closeCreateModalButton" aria-label="关闭">×</button>
      </div>
      <label class="form-field">
        <span>显示名称 / 标题</span>
        <input id="createBlockTitleInput" type="text" autocomplete="off" required placeholder="例如：圆轨道临界问题">
      </label>
      <div class="form-grid">
        <label class="form-field">
          <span>内容类型</span>
          <select id="createBlockTypeSelect">
            <option value="知识点">知识点</option>
            <option value="例题">例题</option>
            <option value="练习">练习</option>
            <option value="方法总结">方法总结</option>
            <option value="普通说明">普通说明</option>
            <option value="题组">题组</option>
            <option value="练习组">练习组</option>
            <option value="专题片段">专题片段</option>
          </select>
        </label>
        <label class="form-field">
          <span>块类型</span>
          <select id="createBlockStructureSelect">
            <option value="原子块">原子块</option>
            <option value="组合块">组合块</option>
          </select>
        </label>
      </div>
      <label class="form-field">
        <span>备注</span>
        <textarea id="createBlockNoteInput" rows="3" placeholder="可选，后续会显示为内容块备注"></textarea>
      </label>
      <div class="modal-actions">
        <button class="ghost-button" type="button" id="cancelCreateBlockButton">取消</button>
        <button class="primary-button" type="submit">新建并插入</button>
      </div>
    </form>
  </div>

  <div class="block-more-menu is-hidden" id="blockMoreMenu" role="menu"></div>

  <script src="./shared-tree.js"></script>
  <script src="./question-bank-context.js"></script>
  <script src="./sections.js"></script>
</body>
</html>
